[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-evidence-ledger"
version = "0.2.0"
description = "Digest-only, fail-closed integrity checks for decision evidence."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
authors = [{ name = "liver-detox" }]

[project.scripts]
decision-evidence = "decision_evidence_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
